name: flowtv
description: A cross-platform IPTV streaming application with EPG, DVR, and multi-view support.
publish_to: 'none'
version: 0.3.11+12

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Video Player - media_kit with FFmpeg/libmpv
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Database - Drift (SQL)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^7.0.0

  # Utilities
  # intl is pinned by flutter_localizations SDK, use 'any' for compatibility
  intl: any
  path_provider: ^2.1.3
  path: ^1.9.0
  xml: ^6.5.0
  collection: ^1.18.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  meta: ^1.12.0

  # UI Components
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Desktop-specific
  window_manager: ^0.5.1

  # Chromecast support (Android/iOS)
  flutter_chrome_cast: ^1.2.8

  # Secure credential storage
  flutter_secure_storage: ^10.0.0

  # Screen wake lock during playback
  wakelock_plus: ^1.6.1

  # Note: Recording uses FFmpeg via Process (Windows/Desktop).
  # FFmpeg must be installed and available in PATH or app directory.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.0
  drift_dev: ^2.22.1
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  fake_async: ^1.3.3
  mocktail: ^1.0.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
